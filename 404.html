<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Jammantech — projects, technology, and an AI-powered portfolio.">
  <meta name="theme-color" content="#0b0b0b">
  <title>Jammantech</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%23111111%27/%3E%3Cpath d=%27M18 15v24c0 8 4 12 12 12 9 0 14-5 14-15V15h-8v21c0 6-2 8-6 8-3 0-4-2-4-6V15z%27 fill=%27%238ca37d%27/%3E%3C/svg%3E">

  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #0b0b0b;
      --panel: rgba(16,16,16,.78);
      --panel-strong: #111;
      --border: #272727;
      --border-hover: #3b3b3b;
      --text: #e8e8e8;
      --muted: #999;
      --faint: #656565;
      --green: #8ca37d;
      --red: #c87f7f;
    }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      line-height: 1.65;
    }

    a { color: inherit; }

    /* =========================================
       RAIN + LEAVES
    ========================================= */

    #weather {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    #weather::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 18%, rgba(95,112,84,.07), transparent 43%),
        linear-gradient(to bottom, rgba(15,18,14,.08), rgba(0,0,0,.23));
    }

    #weather::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.32);
    }

    .rain-drop {
      position: absolute;
      top: -100px;
      width: 1px;
      height: 55px;
      background: rgba(210,220,225,.22);
      transform: rotate(10deg);
      animation: rain linear infinite;
    }

    @keyframes rain {
      from { transform: translate3d(0,-100px,0) rotate(10deg); }
      to   { transform: translate3d(-80px,110vh,0) rotate(10deg); }
    }

    .leaf {
      position: absolute;
      top: -40px;
      width: 11px;
      height: 7px;
      background: #59604e;
      border-radius: 80% 0 80% 0;
      opacity: .3;
      animation: leaf linear infinite;
    }

    @keyframes leaf {
      0%   { transform: translate(0,-60px) rotate(20deg); }
      25%  { transform: translate(70px,25vh) rotate(110deg); }
      50%  { transform: translate(-50px,50vh) rotate(200deg); }
      75%  { transform: translate(90px,75vh) rotate(290deg); }
      100% { transform: translate(-30px,110vh) rotate(360deg); }
    }

    /* =========================================
       PAGE
    ========================================= */

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
    }

    .topbar {
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: 17px 22px;
      pointer-events: none;
      background: linear-gradient(to bottom, rgba(11,11,11,.94), rgba(11,11,11,.57), transparent);
    }

    .brand,
    .top-links { pointer-events: auto; }

    .brand {
      color: #ddd;
      font-size: 14px;
      font-weight: 750;
      text-decoration: none;
    }

    .top-links {
      display: flex;
      gap: 16px;
      color: #727272;
      font-size: 13px;
    }

    .top-links a {
      text-decoration: none;
      transition: color .15s ease;
    }

    .top-links a:hover { color: #ddd; }

    .shell {
      width: min(770px, calc(100% - 36px));
      margin: 0 auto;
      padding: 110px 0 190px;
    }

    .conversation { min-height: 72vh; }

    .message {
      margin: 0 0 26px;
      color: var(--muted);
      font-size: clamp(17px,2.1vw,20px);
      letter-spacing: -.12px;
    }

    .greeting {
      margin: 0 0 31px;
      color: #eee;
      font-size: clamp(27px,4.4vw,38px);
      line-height: 1.22;
      font-weight: 690;
      letter-spacing: -1.2px;
    }

    .word {
      display: inline-block;
      opacity: 0;
      transform: translateY(4px);
      animation: wordIn .27s ease forwards;
    }

    @keyframes wordIn {
      to { opacity: 1; transform: translateY(0); }
    }

    /* =========================================
       TOOL CALL
    ========================================= */

    .tool-call {
      display: flex;
      align-items: center;
      gap: 10px;
      width: fit-content;
      max-width: 100%;
      margin: 24px 0;
      padding: 9px 11px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: rgba(16,16,16,.73);
      color: #8d8d8d;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      backdrop-filter: blur(8px);
    }

    .tool-icon {
      width: 17px;
      height: 17px;
      flex: 0 0 17px;
      display: grid;
      place-items: center;
      color: var(--green);
    }

    .tool-icon svg {
      width: 16px;
      height: 16px;
    }

    .tool-main { min-width: 0; }

    .tool-name {
      color: #bcbcbc;
      font-weight: 700;
    }

    .tool-detail {
      color: #686868;
      display: inline;
    }

    .tool-pulse {
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 1.2s infinite;
    }

    .tool-call.done .tool-pulse {
      animation: none;
      opacity: .65;
    }

    .tool-call.error .tool-pulse {
      animation: none;
      background: var(--red);
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(140,163,125,.35); }
      70% { box-shadow: 0 0 0 7px rgba(140,163,125,0); }
      100% { box-shadow: 0 0 0 0 rgba(140,163,125,0); }
    }

    /* =========================================
       PROJECTS
    ========================================= */

    .section-kicker {
      margin: 31px 0 12px;
      color: #626262;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.45px;
      text-transform: uppercase;
    }

    .projects {
      display: grid;
      gap: 10px;
      margin: 0 0 36px;
    }

    .project {
      display: block;
      padding: 17px 18px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: rgba(15,15,15,.68);
      text-decoration: none;
      backdrop-filter: blur(7px);
      transition:
        background .15s ease,
        border-color .15s ease,
        transform .15s ease;
    }

    .project:hover {
      background: rgba(21,21,21,.89);
      border-color: var(--border-hover);
      transform: translateY(-1px);
    }

    .project-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .project-name {
      color: #e1e1e1;
      font-size: 16px;
      font-weight: 720;
    }

    .project-updated {
      color: #5d5d5d;
      font-size: 11px;
      white-space: nowrap;
    }

    .project-description {
      margin-top: 5px;
      color: #898989;
      font-size: 13px;
      line-height: 1.5;
    }

    .project-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 11px;
      color: #666;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
    }

    .divider {
      height: 1px;
      margin: 37px 0;
      background: linear-gradient(to right, transparent, #242424 12%, #242424 88%, transparent);
    }

    .intro-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: -8px 0 28px;
    }

    .intro-action {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      border: 1px solid #2d2d2d;
      border-radius: 8px;
      background: rgba(17,17,17,.78);
      color: #9a9a9a;
      font-size: 12px;
      text-decoration: none;
      backdrop-filter: blur(7px);
      transition: background .15s ease, border-color .15s ease, color .15s ease, transform .15s ease;
    }

    .intro-action:hover {
      background: #181818;
      border-color: #444;
      color: #e1e1e1;
      transform: translateY(-1px);
    }

    /* =========================================
       CHAT
    ========================================= */

    .chat-turn { margin: 30px 0; }

    .label {
      margin-bottom: 7px;
      color: #5d5d5d;
      font-size: 10px;
      font-weight: 760;
      letter-spacing: 1.35px;
      text-transform: uppercase;
    }

    .chat-user {
      color: #d0d0d0;
      font-size: 15px;
      white-space: pre-wrap;
    }

    .chat-ai {
      color: #aaa;
      font-size: 15px;
    }

    .portfolio-opening-label {
      margin: 2px 0 12px;
      color: #707070;
      font-size: 11px;
      font-weight: 760;
      letter-spacing: 1.15px;
      text-transform: uppercase;
    }

    /* Markdown returned by the AI */
    .markdown {
      color: #aaa;
      font-size: 15px;
      line-height: 1.72;
      overflow-wrap: anywhere;
    }

    .markdown > :first-child { margin-top: 0; }
    .markdown > :last-child { margin-bottom: 0; }

    .markdown p {
      margin: 0 0 12px;
    }

    .markdown strong {
      color: #dedede;
      font-weight: 720;
    }

    .markdown em {
      color: #b8b8b8;
    }

    .markdown h1,
    .markdown h2,
    .markdown h3 {
      margin: 18px 0 8px;
      color: #e3e3e3;
      line-height: 1.3;
      letter-spacing: -.25px;
    }

    .markdown h1 { font-size: 20px; }
    .markdown h2 { font-size: 18px; }
    .markdown h3 { font-size: 16px; }

    .markdown ul,
    .markdown ol {
      margin: 8px 0 13px;
      padding-left: 22px;
    }

    .markdown li {
      margin: 4px 0;
    }

    .markdown code {
      padding: 2px 5px;
      border: 1px solid #2c2c2c;
      border-radius: 5px;
      background: #131313;
      color: #c8c8c8;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: .9em;
    }

    .markdown pre {
      overflow-x: auto;
      margin: 12px 0;
      padding: 12px 13px;
      border: 1px solid #292929;
      border-radius: 9px;
      background: #101010;
    }

    .markdown pre code {
      padding: 0;
      border: 0;
      background: transparent;
    }

    .markdown a {
      color: #a7b89d;
      text-decoration: none;
      border-bottom: 1px solid rgba(167,184,157,.28);
    }

    .markdown a:hover {
      color: #d6dfd0;
      border-bottom-color: rgba(214,223,208,.58);
    }

    .markdown blockquote {
      margin: 12px 0;
      padding: 2px 0 2px 13px;
      border-left: 2px solid #343b31;
      color: #888;
    }

    .markdown hr {
      border: 0;
      border-top: 1px solid #292929;
      margin: 18px 0;
    }

    .markdown-enter {
      animation: markdownIn .24s ease both;
    }

    @keyframes markdownIn {
      from { opacity: 0; transform: translateY(3px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .error-text { color: #b87979; }

    .api-error-detail {
      margin: 8px 0 18px;
      padding: 10px 12px;
      border: 1px solid #3b2929;
      border-radius: 8px;
      background: rgba(42,20,20,.28);
      color: #b98686;
      font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .sources {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin: 11px 0 4px;
    }

    .sources a {
      max-width: 100%;
      padding: 5px 8px;
      border: 1px solid #252525;
      border-radius: 6px;
      color: #707070;
      font-size: 11px;
      text-decoration: none;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sources a:hover {
      color: #b8b8b8;
      border-color: #373737;
    }

    /* =========================================
       COMPOSER
    ========================================= */

    .composer-host {
      position: fixed;
      inset: auto 0 0;
      z-index: 15;
      padding: 46px 16px 17px;
      background: linear-gradient(to top, rgba(11,11,11,.99) 34%, rgba(11,11,11,.8) 69%, transparent);
    }

    .composer-wrap {
      width: min(770px, calc(100% - 4px));
      margin: 0 auto;
    }

    .composer {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 7px;
      border: 1px solid #2d2d2d;
      border-radius: 13px;
      background: rgba(17,17,17,.97);
      box-shadow: 0 12px 45px rgba(0,0,0,.28);
    }

    .composer:focus-within { border-color: #484848; }

    .composer input {
      width: 100%;
      min-width: 0;
      padding: 9px 10px;
      border: 0;
      outline: 0;
      background: transparent;
      color: #ddd;
      font: inherit;
      font-size: 14px;
    }

    .composer input::placeholder { color: #555; }

    .composer button {
      width: 36px;
      height: 36px;
      flex: 0 0 36px;
      display: grid;
      place-items: center;
      border: 1px solid #343434;
      border-radius: 9px;
      background: #191919;
      color: #aaa;
      cursor: pointer;
      transition: background .15s, color .15s, border-color .15s;
    }

    .composer button:hover {
      background: #202020;
      border-color: #454545;
      color: #e0e0e0;
    }

    .composer button:disabled {
      opacity: .45;
      cursor: default;
    }

    .composer button svg {
      width: 17px;
      height: 17px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .composer-note {
      margin: 7px 4px 0;
      color: #4d4d4d;
      font-size: 10px;
      text-align: center;
    }

    /* =========================================
       SOUND BUTTON
    ========================================= */

    #soundButton {
      position: fixed;
      right: 18px;
      bottom: 92px;
      z-index: 30;
      width: 40px;
      height: 40px;
      border: 1px solid #2c2c2c;
      border-radius: 10px;
      background: rgba(17,17,17,.92);
      color: #aaa;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }

    #soundButton:hover { background: #1a1a1a; }

    .config-warning {
      margin: 25px 0;
      padding: 14px 15px;
      border: 1px solid #3a2e2e;
      border-radius: 9px;
      background: rgba(40,22,22,.35);
      color: #bd8b8b;
      font-size: 13px;
    }

    @media (max-width: 650px) {
      .topbar { padding: 15px 17px; }
      .top-links { gap: 11px; }
      .shell {
        width: min(100% - 30px,770px);
        padding-top: 94px;
      }
      .greeting { font-size: 28px; }
      .message { font-size: 17px; }
      .project-top { align-items: flex-start; }
      .project-updated { display: none; }
      .tool-call { align-items: flex-start; }
      #soundButton {
        right: 14px;
        bottom: 89px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .rain-drop, .leaf { display: none; animation: none; }
      .word { opacity: 1; transform: none; animation: none; }
      .tool-pulse { animation: none; }
      .project, .top-links a, .composer button { transition: none; }
    }
  </style>
</head>

<body>
  <div id="weather" aria-hidden="true"></div>

  <div class="page">
    <div class="topbar">
      <a class="brand" href="#">Jammantech</a>

      <div class="top-links">
        <a href="https://github.com/Jamman101213" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a href="https://discord.gg/eYa3myAF7G" target="_blank" rel="noopener noreferrer">Discord</a>
        <a href="https://www.tiktok.com/@jammantech" target="_blank" rel="noopener noreferrer">TikTok</a>
      </div>
    </div>

    <main class="shell">
      <section id="conversation" class="conversation" aria-live="polite" aria-busy="true"></section>
    </main>

    <button
      id="soundButton"
      type="button"
      aria-label="Toggle rain ambience"
      title="Toggle rain ambience"
    >🔇</button>

    <div class="composer-host">
      <div class="composer-wrap">
        <form id="composer" class="composer" aria-label="Ask about Jammantech">
          <input
            id="prompt"
            type="text"
            maxlength="1500"
            autocomplete="off"
            placeholder="Ask anything..."
            aria-label="Ask Jammantech AI"
          >

          <button id="sendButton" type="submit" aria-label="Send">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 19V5m0 0-6 6m6-6 6 6"></path>
            </svg>
          </button>
        </form>

        <p class="composer-note">
          Groq Compound · can search the web and visit public websites
        </p>
      </div>
    </div>
  </div>

  <script>
    /* ============================================================
Wow, so scary! My keys are completely bare in my code. I don't care if you use them lol.
    ============================================================ */

    const Key = "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,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,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";


    /* ============================================================
       SETTINGS
    ============================================================ */

    const GITHUB_USER = "Jamman101213";
    const GROQ_ENDPOINT = "https://api.groq.com/openai/v1/chat/completions";
    const GROQ_MODEL = "groq/compound";

    const conversation = document.getElementById("conversation");
    const composer = document.getElementById("composer");
    const promptInput = document.getElementById("prompt");
    const sendButton = document.getElementById("sendButton");
    const soundButton = document.getElementById("soundButton");

    const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

    let activeKeyIndex = 0;
    let chatHistory = [];

    /*
       Memory from the preset portfolio opening is kept here so
       interactive chat knows what it has ALREADY said on the page.
    */
    let portfolioMemory = [
      {
        role: "assistant",
        content: "Hey! I'm Jammantech."
      }
    ];


    /* ============================================================
       KEY ROTATION
    ============================================================ */

    function getKeys() {
      return String(Key)
        .split(",")
        .map(k => k.trim())
        .filter(Boolean);
    }

    function looksLikePlaceholderKey(key) {
      return !key ||
        /^key\d*$/i.test(key) ||
        key === "YOUR_GROQ_KEY" ||
        key === "gsk_your_key_here";
    }

    function hasConfiguredKey() {
      return getKeys().some(key => !looksLikePlaceholderKey(key));
    }


    /* ============================================================
       UI HELPERS
    ============================================================ */

    function scrollDown() {
      window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
      });
    }

    function toolIcon() {
      return `
        <span class="tool-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path
              d="M14.7 6.3a4 4 0 0 0-5 5L3.5 17.5a2.1 2.1 0 0 0 3 3l6.2-6.2a4 4 0 0 0 5-5l-2.4 2.4-3-3 2.4-2.4Z"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
      `;
    }

    function addTool(name, detail) {
      const el = document.createElement("div");
      el.className = "tool-call";
      el.setAttribute("role", "status");

      el.innerHTML = `
        ${toolIcon()}
        <div class="tool-main">
          <span class="tool-name"></span>
          <span class="tool-detail"></span>
        </div>
        <span class="tool-pulse" aria-hidden="true"></span>
      `;

      el.querySelector(".tool-name").textContent = name + " · ";
      el.querySelector(".tool-detail").textContent = detail;

      conversation.appendChild(el);
      scrollDown();

      return {
        done(detailText) {
          el.classList.add("done");
          if (detailText) {
            el.querySelector(".tool-detail").textContent = detailText;
          }
        },

        error(detailText) {
          el.classList.add("error");
          if (detailText) {
            el.querySelector(".tool-detail").textContent = detailText;
          }
        }
      };
    }

    async function streamText(text, className = "message", wordDelay = 30) {
      const p = document.createElement("p");
      p.className = className;
      conversation.appendChild(p);

      const reducedMotion =
        window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      if (reducedMotion) {
        p.textContent = text;
        scrollDown();
        return p;
      }

      const parts = String(text).split(/(\s+)/);
      let words = 0;

      for (const part of parts) {
        if (/^\s+$/.test(part)) {
          p.appendChild(document.createTextNode(part));
          continue;
        }

        const span = document.createElement("span");
        span.className = "word";
        span.textContent = part;
        p.appendChild(span);

        words++;

        if (words % 7 === 0) {
          scrollDown();
        }

        await sleep(wordDelay);
      }

      scrollDown();
      return p;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function safeLink(url) {
      try {
        const parsed = new URL(url);
        if (parsed.protocol === "http:" || parsed.protocol === "https:") {
          return parsed.href;
        }
      } catch {}
      return "#";
    }

    function renderInlineMarkdown(value) {
      let s = escapeHtml(value);

      /*
         Links are processed first. The URL is validated and the
         visible label remains HTML-escaped.
      */
      s = s.replace(
        /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
        (_, label, url) => {
          const href = safeLink(url);
          return `<a href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer">${label}</a>`;
        }
      );

      s = s.replace(/`([^`\n]+)`/g, "<code>$1</code>");
      s = s.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
      s = s.replace(/__([^_\n]+)__/g, "<strong>$1</strong>");
      s = s.replace(/(^|[\s(])\*([^*\n]+)\*(?=$|[\s).,!?:;])/g, "$1<em>$2</em>");
      s = s.replace(/(^|[\s(])_([^_\n]+)_(?=$|[\s).,!?:;])/g, "$1<em>$2</em>");

      return s;
    }

    function renderMarkdown(markdown) {
      const raw = String(markdown || "").replace(/\r\n?/g, "\n");
      const lines = raw.split("\n");
      const output = [];
      let paragraph = [];
      let listType = null;
      let listItems = [];
      let inCode = false;
      let codeLines = [];

      function flushParagraph() {
        if (!paragraph.length) return;
        output.push(`<p>${renderInlineMarkdown(paragraph.join(" "))}</p>`);
        paragraph = [];
      }

      function flushList() {
        if (!listType || !listItems.length) return;
        output.push(
          `<${listType}>` +
          listItems.map(item => `<li>${renderInlineMarkdown(item)}</li>`).join("") +
          `</${listType}>`
        );
        listType = null;
        listItems = [];
      }

      function flushCode() {
        if (!inCode) return;
        output.push(`<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`);
        inCode = false;
        codeLines = [];
      }

      for (const line of lines) {
        if (/^```/.test(line.trim())) {
          flushParagraph();
          flushList();

          if (inCode) {
            flushCode();
          } else {
            inCode = true;
            codeLines = [];
          }
          continue;
        }

        if (inCode) {
          codeLines.push(line);
          continue;
        }

        const heading = line.match(/^(#{1,3})\s+(.+)$/);
        if (heading) {
          flushParagraph();
          flushList();
          const level = heading[1].length;
          output.push(`<h${level}>${renderInlineMarkdown(heading[2])}</h${level}>`);
          continue;
        }

        const bullet = line.match(/^\s*[-*]\s+(.+)$/);
        if (bullet) {
          flushParagraph();
          if (listType && listType !== "ul") flushList();
          listType = "ul";
          listItems.push(bullet[1]);
          continue;
        }

        const numbered = line.match(/^\s*\d+[.)]\s+(.+)$/);
        if (numbered) {
          flushParagraph();
          if (listType && listType !== "ol") flushList();
          listType = "ol";
          listItems.push(numbered[1]);
          continue;
        }

        const quote = line.match(/^\s*>\s?(.*)$/);
        if (quote) {
          flushParagraph();
          flushList();
          output.push(`<blockquote>${renderInlineMarkdown(quote[1])}</blockquote>`);
          continue;
        }

        if (/^\s*---+\s*$/.test(line)) {
          flushParagraph();
          flushList();
          output.push("<hr>");
          continue;
        }

        if (!line.trim()) {
          flushParagraph();
          flushList();
          continue;
        }

        paragraph.push(line.trim());
      }

      flushParagraph();
      flushList();
      if (inCode) flushCode();

      return output.join("");
    }

    async function showMarkdown(text, className = "chat-ai") {

      scrollDown();

      /*
         Keep a tiny reveal delay so Markdown replies still feel
         like part of the animated conversation without displaying
         raw **asterisks** while the answer is arriving.
      */
      await sleep(90);
      return wrap;
    }

    /* ============================================================
       GROQ REQUEST
       Tries each comma-separated key if one fails from:
       - invalid/revoked key
       - rate limit
       - temporary server error

       It does NOT print your keys anywhere.
    ============================================================ */

    async function groqRequest(messages) {
      const keys = getKeys();

      if (!keys.length) {
        throw new Error("No Groq API key configured.");
      }

      let lastError = null;

      for (let attempt = 0; attempt < keys.length; attempt++) {
        const index = (activeKeyIndex + attempt) % keys.length;
        const key = keys[index];

        if (looksLikePlaceholderKey(key)) {
          lastError = new Error("Replace the example keys with real Groq API keys.");
          continue;
        }

        try {
          let response = await fetch(GROQ_ENDPOINT, {
            method: "POST",

            headers: {
              "Authorization": `Bearer ${key}`,
              "Content-Type": "application/json",
              "Groq-Model-Version": "latest"
            },

            body: JSON.stringify({
              model: GROQ_MODEL,
              messages,

              /*
                 IMPORTANT:
                 Groq's general Chat API currently defaults citation_options
                 to "enabled", but groq/compound rejects citation-enabled
                 requests. Force it OFF instead of merely omitting the field.
              */
              citation_options: "disabled"
            })
          });

          let data = await response.json().catch(() => ({}));

          /*
             Compatibility fallback:
             if Groq changes Compound's accepted request fields and rejects
             citation_options itself, retry the exact documented minimal
             Compound request once.
          */
          const firstErrorText = String(
            data?.error?.message ||
            data?.error ||
            ""
          ).toLowerCase();

          if (
            response.status === 400 &&
            firstErrorText.includes("citation_options") &&
            !firstErrorText.includes("does not support citations")
          ) {
            response = await fetch(GROQ_ENDPOINT, {
              method: "POST",
              headers: {
                "Authorization": `Bearer ${key}`,
                "Content-Type": "application/json",
                "Groq-Model-Version": "latest"
              },
              body: JSON.stringify({
                model: GROQ_MODEL,
                messages
              })
            });

            data = await response.json().catch(() => ({}));
          }

          if (response.ok) {
            activeKeyIndex = index;

            const message =
              data?.choices?.[0]?.message || {};

            return {
              content:
                message.content ||
                "I couldn't generate a response.",

              executedTools:
                Array.isArray(message.executed_tools)
                  ? message.executed_tools
                  : []
            };
          }

          const detail =
            data?.error?.message ||
            `Groq returned HTTP ${response.status}`;

          lastError =
            new Error(detail);

          /*
             Rotate to another key for authentication errors,
             rate limits, and temporary Groq failures.
          */
          if (
            response.status === 401 ||
            response.status === 403 ||
            response.status === 429 ||
            response.status >= 500
          ) {
            continue;
          }

          /*
             A 400-level request error usually means the request itself
             is invalid, so changing keys probably will not help.
          */
          throw lastError;

        } catch (error) {
          lastError = error;

          /*
             A browser/network/CORS error will generally affect every
             key, but trying the remaining keys does no harm.
          */
        }
      }

      throw lastError || new Error("All Groq keys failed.");
    }


    /* ============================================================
       GROQ TOOL DISPLAY
    ============================================================ */

    function summarizeTool(tool) {
      const type = String(
        tool?.type ||
        tool?.tool_name ||
        tool?.name ||
        "tool"
      ).toLowerCase();

      let title = "Tool";

      if (type.includes("search")) {
        title = "Search";
      } else if (
        type.includes("visit") ||
        type.includes("website")
      ) {
        title = "Visit website";
      }

      let detail = "";

      const args =
        tool?.arguments ||
        tool?.input ||
        tool?.args;

      if (typeof args === "string") {
        try {
          const parsed = JSON.parse(args);
          detail =
            parsed.query ||
            parsed.url ||
            parsed.website ||
            "";
        } catch {
          detail = args;
        }
      } else if (args && typeof args === "object") {
        detail =
          args.query ||
          args.url ||
          args.website ||
          "";
      }

      return { title, detail };
    }

    function addExecutedToolRows(tools) {
      if (!Array.isArray(tools) || !tools.length) {
        return;
      }

      for (const tool of tools) {
        const info = summarizeTool(tool);

        const row = addTool(
          info.title,
          info.detail || "Completed"
        );

        row.done(
          info.detail || "Completed"
        );
      }
    }

    function extractUrlsFromTools(tools) {
      const urls = new Set();

      function walk(value) {
        if (!value) return;

        if (typeof value === "string") {
          const matches =
            value.match(/https?:\/\/[^\s"'<>]+/g);

          if (matches) {
            for (let url of matches) {
              url = url.replace(/[),.;\]]+$/, "");
              urls.add(url);
            }
          }

          return;
        }

        if (Array.isArray(value)) {
          value.forEach(walk);
          return;
        }

        if (typeof value === "object") {
          Object.values(value).forEach(walk);
        }
      }

      walk(tools);

      return [...urls].slice(0, 6);
    }

    function addSourceLinks(tools) {
      const urls = extractUrlsFromTools(tools);

      if (!urls.length) return;

      const wrap = document.createElement("div");
      wrap.className = "sources";

      for (const value of urls) {
        try {
          const url = new URL(value);

          if (
            url.protocol !== "http:" &&
            url.protocol !== "https:"
          ) {
            continue;
          }

          const a = document.createElement("a");
          a.href = url.href;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.textContent =
            url.hostname.replace(/^www\./, "");

          wrap.appendChild(a);

        } catch {}
      }

      if (wrap.childElementCount) {
        conversation.appendChild(wrap);
      }
    }


    /* ============================================================
       GITHUB PROJECTS
       Public endpoint only.
    ============================================================ */

    async function getRecentPublicProjects() {
      const url =
        `https://api.github.com/users/${encodeURIComponent(GITHUB_USER)}/repos` +
        "?type=owner&sort=updated&direction=desc&per_page=30";

      const response = await fetch(url, {
        headers: {
          "Accept": "application/vnd.github+json"
        }
      });

      if (!response.ok) {
        throw new Error(
          `GitHub returned HTTP ${response.status}`
        );
      }

      const repos = await response.json();

      /*
         The unauthenticated /users/:name/repos endpoint exposes
         PUBLIC repos. Prefer non-forks so the list shows your projects.
      */
      const originals =
        repos.filter(repo => !repo.fork);

      const pool =
        originals.length >= 3
          ? originals
          : repos;

      return pool
        .sort((a, b) =>
          new Date(b.pushed_at || b.updated_at) -
          new Date(a.pushed_at || a.updated_at)
        )
        .slice(0, 3)
        .map(repo => ({
          name: repo.name,
          description:
            repo.description ||
            "Public GitHub project.",
          url: repo.html_url,
          language: repo.language || "",
          stars: repo.stargazers_count || 0,
          pushedAt:
            repo.pushed_at ||
            repo.updated_at
        }));
    }

      leaf.style.animationDelay =
        (-Math.random() * 15) + "s";

      leaf.style.opacity =
        0.15 + Math.random() * 0.3;

      weather.appendChild(leaf);
    }


    /* ============================================================
       SYNTHESIZED RAIN AUDIO
       No MP3 needed — keeps this as ONE file.
    ============================================================ */

    let audioContext = null;
    let rainGain = null;
    let rainSource = null;
    let audioEnabled = false;

    function createRainBuffer(ctx) {
      const seconds = 4;
      const frameCount =
        ctx.sampleRate * seconds;

      const buffer =
        ctx.createBuffer(
          2,
          frameCount,
          ctx.sampleRate
        );

      for (
        let channel = 0;
        channel < buffer.numberOfChannels;
        channel++
      ) {
        const data =
          buffer.getChannelData(channel);

        let previous = 0;

        for (let i = 0; i < frameCount; i++) {
          const white =
            Math.random() * 2 - 1;

          /*
             Simple smoothing gives the noise a softer
             "rain" character instead of harsh white noise.
          */
          previous =
            previous * 0.82 +
            white * 0.18;

          data[i] =
            previous * 0.62;
        }
      }

      return buffer;
    }

    let rainStarted = false;
    let firstInteractionHandled = false;

    function buildRainGraph() {
      if (rainStarted) return;

      rainGain =
        audioContext.createGain();

      rainGain.gain.value =
        0;

      const lowpass =
        audioContext.createBiquadFilter();

      lowpass.type =
        "lowpass";

      lowpass.frequency.value =
        5200;

      const highpass =
        audioContext.createBiquadFilter();

      highpass.type =
        "highpass";

      highpass.frequency.value =
        350;

      rainSource =
        audioContext.createBufferSource();

      rainSource.buffer =
        createRainBuffer(audioContext);

      rainSource.loop =
        true;

      rainSource
        .connect(highpass)
        .connect(lowpass)
        .connect(rainGain)
        .connect(audioContext.destination);

      rainSource.start();
      rainStarted = true;
    }

    async function startRainAudio() {
      const AudioContextClass =
        window.AudioContext ||
        window.webkitAudioContext;

      if (!AudioContextClass) {
        return;
      }

      if (!audioContext) {
        audioContext =
          new AudioContextClass();
      }

      /*
         resume() is called directly from a real click/key/touch event.
         The audio graph is started only after Chrome allows the context.
      */
      if (audioContext.state === "suspended") {
        await audioContext.resume();
      }

      if (audioContext.state !== "running") {
        return;
      }

      buildRainGraph();

      rainGain.gain.cancelScheduledValues(
        audioContext.currentTime
      );

      rainGain.gain.setTargetAtTime(
        0.055,
        audioContext.currentTime,
        0.05
      );

      audioEnabled =
        true;

      soundButton.textContent =
        "🔊";
    }

    function stopRainAudio() {
      if (
        !audioContext ||
        !rainGain
      ) {
        return;
      }

      rainGain.gain.cancelScheduledValues(
        audioContext.currentTime
      );

      rainGain.gain.setTargetAtTime(
        0,
        audioContext.currentTime,
        0.04
      );

      audioEnabled =
        false;

      soundButton.textContent =
        "🔇";
    }

    soundButton.addEventListener(
      "click",
      async event => {
        event.stopPropagation();

        if (audioEnabled) {
          stopRainAudio();
        } else {
          try {
            await startRainAudio();
          } catch (error) {
            console.warn("Rain audio could not start:", error);
          }
        }
      }
    );

    async function firstInteraction() {
      if (firstInteractionHandled) {
        return;
      }

      firstInteractionHandled = true;

      /* Remove immediately so touch + click cannot race each other. */
      window.removeEventListener(
        "click",
        firstInteraction
      );

      window.removeEventListener(
        "keydown",
        firstInteraction
      );

      window.removeEventListener(
        "touchstart",
        firstInteraction
      );

      if (!audioEnabled) {
        try {
          await startRainAudio();
        } catch (error) {
          console.warn("Rain audio could not start:", error);
        }
      }
    }

    window.addEventListener(
      "click",
      firstInteraction
    );

    window.addEventListener(
      "keydown",
      firstInteraction
    );

    window.addEventListener(
      "touchstart",
      firstInteraction,
      { passive: true }
    );


    /* ============================================================
       START
    ============================================================ */

    openingSequence();
  </script>
</body>
</html>
